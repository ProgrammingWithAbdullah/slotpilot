name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slotpilot
          POSTGRES_PASSWORD: slotpilot
          POSTGRES_DB: slotpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slotpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slotpilot:slotpilot@localhost:5432/slotpilot_test
      E2E_DATABASE_URL: postgres://slotpilot:slotpilot@localhost:5432/slotpilot_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests (real Postgres, mock LLM)
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end tests (Playwright)
        run: |
          PGPASSWORD=slotpilot psql -h localhost -U slotpilot -d slotpilot_test -c "CREATE DATABASE slotpilot_e2e"
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t slotpilot .
